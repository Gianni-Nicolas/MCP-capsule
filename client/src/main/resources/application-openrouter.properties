# ===== OpenRouter · Cohere North Mini Code (SIN razonamiento) — OpenAI-compatible =====
# OpenRouter expone una API compatible con OpenAI; se reusa el starter de OpenAI.
spring.ai.openai.base-url=https://openrouter.ai/api/v1
# API key desde la variable de entorno OPENROUTER_API_KEY (no hardcodear).
spring.ai.openai.api-key=${OPENROUTER_API_KEY}
spring.ai.openai.chat.options.model=${OPENROUTER_MODEL:cohere/north-mini-code:free}
# Temperatura baja para respuestas deterministas de SQL.
spring.ai.openai.chat.options.temperature=0.1
# OpenRouter no expone el endpoint de embeddings de OpenAI; se desactiva el autoconfig.
spring.ai.openai.embedding.enabled=false