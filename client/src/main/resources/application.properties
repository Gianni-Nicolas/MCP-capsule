spring.application.name=client

# El server MCP corre en 8080; el client en 8081 para no colisionar.
server.port=8081

# ===== Provider / Modelo LLM (por PERFIL) =====
# La config del proveedor (base-url, api-key, model, strip-reasoning) vive en un archivo
# por perfil, para poder alternar sin editar este archivo:
#   application-groq.properties        -> Groq qwen/qwen3.8-27b    (CON razonamiento + interceptor)
#   application-openrouter.properties  -> OpenRouter North Mini    (SIN razonamiento)
# Activar con:  --spring.profiles.active=groq   (o openrouter)
# Perfil por defecto si no se especifica ninguno:
spring.profiles.active=openrouter

# ===== Cliente MCP -> Server de metadata (transporte SSE) =====
spring.ai.mcp.client.enabled=true
spring.ai.mcp.client.name=capsula-mcp-client
spring.ai.mcp.client.version=0.1.0
spring.ai.mcp.client.type=SYNC
# Timeout amplio: el LLM puede encadenar varias tool-calls antes de responder.
spring.ai.mcp.client.request-timeout=60s
# Expone las tools MCP como ToolCallbacks para el ChatClient.
spring.ai.mcp.client.toolcallback.enabled=true
# Conexion SSE al server (sse-endpoint /sse definido en el server).
spring.ai.mcp.client.sse.connections.server.url=http://localhost:8080
spring.ai.mcp.client.sse.connections.server.sse-endpoint=/sse

# Logging util para trazar la generacion.
logging.level.com.capsula.mcp.client=INFO

# ===== Swagger UI / OpenAPI (springdoc) =====
# UI:   http://localhost:8081/swagger-ui.html
# JSON: http://localhost:8081/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
#springdoc.api-docs.enabled=false
#springdoc.swagger-ui.enabled=false

# ===== Observabilidad tecnica (Micrometer Observation) =====
# Incluye argumentos/resultado de las tools en las observaciones (dev; puede exponer datos).
spring.ai.tools.observations.include-content=true
# Loguea prompt y completion del chat en las observaciones (dev).
spring.ai.chat.observations.log-prompt=false
spring.ai.chat.observations.log-completion=true
# Expone endpoints de Actuator con metricas (incluye timers de spring.ai.* ).
management.endpoints.web.exposure.include=health,info,metrics
management.observations.annotations.enabled=true
# Log del handler propio que imprime cada observacion de Spring AI.
logging.level.com.capsula.mcp.client.observability=INFO