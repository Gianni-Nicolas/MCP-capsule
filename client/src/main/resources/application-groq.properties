# ===== Groq · qwen/qwen3.8-27b (CON razonamiento) — OpenAI-compatible =====
# Groq expone una API compatible con OpenAI; se reusa el starter de OpenAI.
spring.ai.openai.base-url=https://api.groq.com/openai/v1
# API key desde la variable de entorno GROQ_API_KEY (no hardcodear).
spring.ai.openai.api-key=${GROQ_API_KEY}
# qwen3.8-27b es un modelo de reasoning: activa el interceptor que remueve reasoning_content. Ver ReasoningContentStripConfig.
capsula.model.strip-reasoning=true
spring.ai.openai.chat.options.model=qwen/qwen3.8-27b
# Temperatura baja para respuestas deterministas de SQL.
spring.ai.openai.chat.options.temperature=0.1
# Groq no expone el endpoint de embeddings de OpenAI; se desactiva el autoconfig.
spring.ai.openai.embedding.enabled=false