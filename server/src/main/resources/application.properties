spring.application.name=server

# Perfil por defecto para desarrollo local.
spring.profiles.active=h2

# Identidad del servidor MCP.
spring.ai.mcp.server.name=database-metadata-mcp
spring.ai.mcp.server.version=0.1.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.sse-endpoint=/sse
spring.ai.mcp.server.sse-message-endpoint=/mcp/message

# Guardrails del servicio de metadata (ver MetadataProperties).
mcp.metadata.max-results=200

# Logging util para trazar invocaciones MCP.
logging.level.com.capsula.mcp.server.tools=INFO
logging.level.com.capsula.mcp.server.metadata=INFO