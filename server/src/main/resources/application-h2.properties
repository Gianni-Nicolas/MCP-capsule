# H2 local en memoria
spring.datasource.url=jdbc:h2:mem:mcpdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Consola web H2 para inspeccion manual
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Pool de conexiones (ajustar segun carga)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# Inicializacion automatica para scripts schema.sql/data.sql en desarrollo
spring.sql.init.mode=always

